name: Prepare Malaysia news carousel
on:
  schedule:
    - cron: '5 7 * * *'
      timezone: Asia/Kuala_Lumpur
  workflow_dispatch:
    inputs:
      live_preview:
        description: 'Retrieve real RSS articles for private review ONLY (never publish)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  prepare:
    # Allow scheduled preparation; use demo content until source rights are confirmed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build carousel and verify sources
        env:
          DEMO: ${{ (github.event_name == 'workflow_dispatch' && !inputs.live_preview) || (github.event_name == 'schedule' && vars.RIGHTS_CONFIRMED != 'true') }}
        run: |
          if [ "$DEMO" = "true" ]; then
            python src/pipeline.py prepare --demo
          else
            python src/pipeline.py prepare
          fi
      - name: Upload files for manual review
        uses: actions/upload-artifact@v4
        with:
          name: instagram-carousel
          path: docs/daily/
          retention-days: 7
      - name: Store live graphics for GitHub Pages
        if: ${{ github.event_name == 'schedule' && vars.RIGHTS_CONFIRMED == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/daily/
          git diff --cached --quiet || (git commit -m 'Prepare verified daily news slides' && git push)
