name: Publish Instagram carousel
on:
  schedule:
    - cron: '30 7 * * *'
      timezone: Asia/Kuala_Lumpur
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: ${{ vars.ENABLE_PUBLISH == 'true' && vars.RIGHTS_CONFIRMED == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: instagram-daily-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Publish via official Instagram API
        env:
          ENABLE_PUBLISH: ${{ vars.ENABLE_PUBLISH }}
          RIGHTS_CONFIRMED: ${{ vars.RIGHTS_CONFIRMED }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v24.0' }}
        run: python src/pipeline.py publish
      - name: Commit publication history after success
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.json
          git diff --cached --quiet || (git commit -m 'Record published news stories' && git push)
